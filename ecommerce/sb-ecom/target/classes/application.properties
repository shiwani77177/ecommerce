spring.application.name=sb-ecom

# --- PostgreSQL datasource -----------------------------------------------
# Defaults target a local Postgres; Docker Compose overrides these via env vars.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ecom}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ecompass}

# --- JPA / Hibernate ------------------------------------------------------
# 'update' is convenient for development; use a migration tool (Flyway/Liquibase)
# and 'validate' for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# We manage Docker Compose ourselves, so keep Spring's integration off.
spring.docker.compose.enabled=false

# --- Error responses ------------------------------------------------------
server.error.include-message=always
